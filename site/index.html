<div id="app"></div>
<script>
const BASE=location.pathname.startsWith('/ui-ux-designer/')?'/ui-ux-designer/':'/';
const route=location.pathname.replace(BASE,'').replace(/^\/|\/$/g,'');
const app=document.getElementById('app');
const nav=()=>`<nav class="topnav"><a class="brand" href="${BASE}">🎀 Brianna Dickenson</a><div class="navlinks"><a href="${BASE}sweet-habits/">🍓 Sweet Habits</a><a href="${BASE}blossom-ui/">🌸 Blossom UI</a><a href="${BASE}honeycomb-hq/">🍯 Honeycomb HQ</a></div></nav>`;
function modal(title,body,actions=''){const returnFocus=document.activeElement;document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mhead"><h2 id="mt">${title}</h2><button class="close" aria-label="Close dialog">×</button></div><div class="mbody">${body}</div><div class="mactions">${actions}</div></section></div>`);const b=document.getElementById('modalBackdrop');const close=()=>{b.remove();if(returnFocus&&returnFocus.focus)returnFocus.focus()};b.querySelector('.close').focus();b.querySelector('.close').onclick=close;b.onclick=e=>{if(e.target===b)close()};document.addEventListener('keydown',function keys(e){if(!document.body.contains(b)){document.removeEventListener('keydown',keys);return}if(e.key==='Escape'){close();document.removeEventListener('keydown',keys);return}if(e.key==='Tab'){const els=[...b.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});return b}
function landing(){app.innerHTML=`<div class="landing">${nav()}<main id="main"><section class="hero"><div><p class="eyebrow">UI/UX Designer · Product Design · Design Systems</p><h1>Thoughtful experiences with a little softness built in.</h1><p class="lede">I design accessible web and mobile products from problem framing and information architecture through high-fidelity UI, prototyping, testing, and developer handoff.</p><div class="actions"><a class="btn primary" href="#work">View my work</a><a class="btn secondary" href="mailto:breyhanadickenson@gmail.com?subject=Interested%20in%20Working%20With%20You">Email me</a></div><div class="availability">🕓 Open to full-time remote roles · 💌 Available for short-term freelance projects</div></div><div class="heroart"><div class="float f1"><span>🍓</span><strong>Mobile UX</strong><small>Sweet Habits</small></div><div class="float f2"><span>🌸</span><strong>Design Systems</strong><small>Blossom UI</small></div><div class="float f3"><span>🍯</span><strong>B2B SaaS</strong><small>Honeycomb HQ</small></div></div></section><section class="section" id="work"><p class="eyebrow">Featured work</p><h2>Three projects, three different design muscles.</h2><div class="grid3">${[['🍓','Sweet Habits','Mobile Product Redesign','A gentle habit tracker that turns routine-building into a calm, encouraging experience.','sweetbg','sweet-habits/','https://github.com/breyhanaariel/ui-ux-designer/tree/main/sweet-habits','https://www.figma.com/design/3BObCtX2MJOLX0rZgTg1Vn?node-id=1-16'],['🌸','Blossom UI','Modular Design System','A floral-inspired system proving expressive visual design can still be scalable and implementation-ready.','blossombg','blossom-ui/','https://github.com/breyhanaariel/ui-ux-designer/tree/main/blossom-ui','https://www.figma.com/design/3BObCtX2MJOLX0rZgTg1Vn?node-id=1-43'],['🍯','Honeycomb HQ','Creative Agency Operations SaaS','A responsive B2B workspace for risks, approvals, deadlines, workload, and billing.','honeybg','honeycomb-hq/','https://github.com/breyhanaariel/ui-ux-designer/tree/main/honeycomb-hq','https://www.figma.com/design/3BObCtX2MJOLX0rZgTg1Vn?node-id=1-77']].map(p=>`<article class="card"><div class="preview ${p[4]}">${p[0]}</div><p class="eyebrow" style="margin-top:17px">${p[2]}</p><h3>${p[1]}</h3><p>${p[3]}</p><div class="chips"><span class="pill">Responsive UI</span><span class="pill">Accessibility</span><span class="pill">Interaction</span></div><div class="actions"><a class="btn primary" href="${BASE+p[5]}">Live project</a><a class="btn secondary" href="${p[6]}">Case study</a><a class="btn secondary" href="${p[7]}">Figma</a></div></article>`).join('')}</div></section><section class="section about"><div><p class="eyebrow">How I work</p><h2>Structure first. Personality on purpose.</h2></div><div class="process">${[['01 Understand','Problem, audience, constraints, success.'],['02 Structure','Flows, hierarchy, IA, content.'],['03 Explore','Wireframes and competing directions.'],['04 Design','Accessible responsive high-fidelity UI.'],['05 Validate','Test assumptions and iterate.'],['06 Handoff','States, specs, components, implementation notes.']].map(x=>`<div><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div></section><section class="section contact"><p class="eyebrow">Work with me</p><h2>Have a product that needs clarity and character?</h2><p>I’m seeking full-time remote UI/UX or Product Design roles and short-term freelance projects.</p><div class="actions"><a class="btn primary" href="mailto:breyhanadickenson@gmail.com?subject=Interested%20in%20Working%20With%20You">Email me</a><a class="btn secondary" href="https://www.linkedin.com/in/brianna-dickenson-9555515b">LinkedIn</a></div></section></main><footer class="footer">Designed & built as a living UI/UX portfolio · 2026</footer></div>`}

let habits=[
{id:1,n:'Morning water',i:'💧',d:true,s:8,f:'Every day',r:'8:00 AM',p:false,m:false},
{id:2,n:'10 minute stretch',i:'🌷',d:false,s:4,f:'Weekdays',r:'6:30 PM',p:false,m:true},
{id:3,n:'Read a little',i:'📚',d:false,s:12,f:'Every day',r:'9:00 PM',p:false,m:false}
];
let sweetView='today',sweetFirst=true,sweetLoading=false,sweetError=false,sweetPrefs={reduced:false,celebrate:true,gentle:true};

function sweetToast(msg){document.body.insertAdjacentHTML('beforeend','<div class="toast" role="status">'+msg+'</div>');setTimeout(()=>document.getElementById('toast')?.remove(),2200)}
function sweetNav(active){return '<nav class="phonenav" aria-label="Sweet Habits"><button data-sview="today" class="'+(active==='today'?'active':'')+'">⌂<span>Today</span></button><button data-sview="progress" class="'+(active==='progress'?'active':'')+'">♡<span>Progress</span></button><button data-sview="settings" class="'+(active==='settings'?'active':'')+'">⚙<span>Settings</span></button></nav>'}
function sweetWireNav(){document.querySelectorAll('[data-sview]').forEach(function(b){b.onclick=function(){sweetView=b.dataset.sview;sweetScreen()}})}
function sweetModal(title,body,actions){return modal(title,body,actions||'')}
function sweetScreen(){
 const s=document.querySelector('.screen');if(!s)return;
 if(sweetFirst){s.innerHTML='<div class="sweet-welcome"><div><div class="berry">🍓</div><p class="eyebrow">Welcome to Sweet Habits</p><h2>Small steps count.</h2><p>Build routines without shame-based streak pressure.</p><div class="sweet-actions"><button class="btn pink" id="sweetSetup">Set up my day</button><button class="btn secondary" id="sweetSkip">Skip setup</button></div></div></div>';document.getElementById('sweetSetup').onclick=sweetSetup;document.getElementById('sweetSkip').onclick=function(){sweetFirst=false;sweetScreen()};return}
 if(sweetLoading){s.innerHTML='<div class="greeting"><div><small>Loading</small><h2>Sweet Habits</h2></div></div><div class="note"><div style="height:12px;background:#eee3e9;border-radius:8px;margin:8px 0"></div><div style="height:12px;background:#eee3e9;border-radius:8px;margin:8px 0"></div><div style="height:12px;background:#eee3e9;border-radius:8px;margin:8px 0"></div></div>'+sweetNav(sweetView);sweetWireNav();return}
 if(sweetError){s.innerHTML='<div class="greeting"><div><small>Something went wrong</small><h2>We couldn\'t refresh progress.</h2></div></div><div class="note"><p>Your local habit changes are still safe.</p><button class="btn pink" id="sweetRetry">Try again</button></div>'+sweetNav(sweetView);document.getElementById('sweetRetry').onclick=function(){sweetError=false;sweetLoading=true;sweetScreen();setTimeout(function(){sweetLoading=false;sweetScreen();sweetToast('Progress refreshed')},700)};sweetWireNav();return}
 if(sweetView==='progress')sweetProgress();else if(sweetView==='settings')sweetSettings();else sweetToday();
}
function sweetSetup(){const m=sweetModal('Quick setup','<form id="sweetSetupForm"><label class="sweet-field">What should we call you?<input name="name" value="Brianna" required></label><label class="sweet-field">Daily encouragement<select><option>Gentle</option><option>Neutral</option></select></label><label class="sweet-field">Default reminder<select><option>8:00 AM</option><option>12:00 PM</option><option>6:00 PM</option></select></label></form>','<button class="btn pink" form="sweetSetupForm">Continue</button>');m.querySelector('#sweetSetupForm').onsubmit=function(e){e.preventDefault();sweetFirst=false;m.remove();sweetScreen();sweetToast('Setup saved locally ✨')}}
function sweetToday(){
 const s=document.querySelector('.screen'),active=habits.filter(function(h){return !h.p}),done=active.filter(function(h){return h.d}).length,pct=active.length?Math.round(done/active.length*100):0;
 s.innerHTML='<div class="greeting"><div><small>Good morning</small><h2>One sweet step at a time 🍓</h2></div><button class="avatar" id="sweetAvatar" aria-label="Open settings">BD</button></div><div class="progress"><div class="progresshead"><strong>'+pct+'%</strong><span>'+done+' of '+active.length+' complete</span></div><div class="track"><i style="width:'+pct+'%"></i></div><p>'+(pct===100?'Everything is done. Tiny victory dance optional.':pct>=50?'You’re already halfway there.':'A gentle start still counts.')+'</p></div><div class="today"><div><small>Today</small><h3>Your little list</h3></div><button class="add" id="sweetAdd" aria-label="Add habit">+</button></div><div class="habitlist">'+(active.length?active.map(function(h){return '<div><button class="habit '+(h.d?'done':'')+'" data-habit="'+h.id+'" aria-pressed="'+h.d+'"><span class="hicon">'+h.i+'</span><span class="hname"><strong>'+h.n+'</strong><small>'+h.f+' · '+h.r+(h.m?' · missed yesterday':'')+'</small></span><span class="check">'+(h.d?'✓':'')+'</span></button>'+(h.m&&!h.d?'<button class="btn secondary recover" data-recover="'+h.id+'" style="margin-top:4px;padding:7px 10px">Recover missed day</button>':'')+'</div>'}).join(''):'<div class="sweet-empty"><strong>No active habits</strong><p>Add one or resume a paused habit in Settings.</p></div>')+'</div><div class="sweet-state"><strong>Prototype states</strong><div class="sweet-actions" style="margin-top:8px"><button class="btn secondary" id="sweetLoad">Loading</button><button class="btn secondary" id="sweetFail">Error</button><button class="btn secondary" id="sweetDisabled" disabled>Disabled</button></div></div>'+sweetNav('today');
 document.getElementById('sweetAvatar').onclick=function(){sweetView='settings';sweetScreen()};document.getElementById('sweetAdd').onclick=function(){sweetEdit()};
 document.querySelectorAll('[data-habit]').forEach(function(b){b.onclick=function(e){if(e.detail===2){sweetEdit(+b.dataset.habit);return}const h=habits.find(function(x){return x.id==b.dataset.habit});h.d=!h.d;if(h.d){h.m=false;h.s++;if(sweetPrefs.celebrate)sweetToast(sweetPrefs.reduced?'Habit completed':'✨ Sweet! Habit completed ✨')}sweetScreen()};b.oncontextmenu=function(e){e.preventDefault();sweetEdit(+b.dataset.habit)}});
 document.querySelectorAll('[data-recover]').forEach(function(b){b.onclick=function(){const h=habits.find(function(x){return x.id==b.dataset.recover});h.m=false;sweetToast('Missed day recovered without breaking your streak');sweetScreen()}});
 document.getElementById('sweetLoad').onclick=function(){sweetLoading=true;sweetScreen();setTimeout(function(){sweetLoading=false;sweetScreen()},700)};document.getElementById('sweetFail').onclick=function(){sweetError=true;sweetScreen()};sweetWireNav();
}
function sweetEdit(id){
 const h=id?habits.find(function(x){return x.id===id}):null;
 const body='<form id="sweetHabitForm" novalidate><label class="sweet-field">Habit name<input name="name" value="'+(h?h.n:'')+'" placeholder="e.g. Drink water"><span class="sweet-error" id="sweetNameError"></span></label><label class="sweet-field">Frequency<select name="frequency"><option '+(h&&h.f==='Every day'?'selected':'')+'>Every day</option><option '+(h&&h.f==='Weekdays'?'selected':'')+'>Weekdays</option><option '+(h&&h.f==='3× weekly'?'selected':'')+'>3× weekly</option></select></label><label class="sweet-field">Reminder<select name="reminder"><option>8:00 AM</option><option>12:00 PM</option><option>6:30 PM</option><option>9:00 PM</option><option>Off</option></select></label>'+(h?'<label class="sweet-field">Status<select name="status"><option '+(!h.p?'selected':'')+'>Active</option><option '+(h.p?'selected':'')+'>Paused</option></select></label>':'')+'</form>';
 const m=sweetModal(h?'Edit habit':'Add a tiny habit',body,'<button class="btn pink" form="sweetHabitForm">'+(h?'Save changes':'Add habit')+'</button>');
 m.querySelector('[name=reminder]').value=h?h.r:'8:00 AM';
 m.querySelector('#sweetHabitForm').onsubmit=function(e){e.preventDefault();const d=new FormData(e.target),name=d.get('name').trim();if(name.length<2){m.querySelector('#sweetNameError').textContent='Enter at least 2 characters.';return}if(h){h.n=name;h.f=d.get('frequency');h.r=d.get('reminder');h.p=d.get('status')==='Paused'}else habits.push({id:Date.now(),n:name,i:'✨',d:false,s:0,f:d.get('frequency'),r:d.get('reminder'),p:false,m:false});m.remove();sweetScreen();sweetToast(h?'Habit updated':'Habit added')}
}
function sweetProgress(){
 const s=document.querySelector('.screen'),active=habits.filter(function(h){return !h.p});
 s.innerHTML='<div class="greeting"><div><small>This week</small><h2>Your progress</h2></div><button class="avatar" id="sweetRefresh" aria-label="Refresh progress">↻</button></div><div class="note"><strong>Weekly glow</strong><div class="sweet-week">'+['M','T','W','Th','F','Sa','Su'].map(function(d,i){return '<div class="sweet-day '+(i<4?'on':'')+'">'+d+'</div>'}).join('')+'</div><div class="sweet-bars">'+[72,45,88,62,95,54,30].map(function(v){return '<i style="height:'+v+'%"></i>'}).join('')+'</div></div><div class="note"><strong>Habits</strong><div class="habitlist">'+active.map(function(h){return '<button class="habit sweetDetail" data-id="'+h.id+'"><span class="hicon">'+h.i+'</span><span class="hname"><strong>'+h.n+'</strong><small>'+h.s+' day gentle streak · '+(h.d?'Done today':'Still open')+'</small></span><span>›</span></button>'}).join('')+'</div></div>'+sweetNav('progress');
 document.querySelectorAll('.sweetDetail').forEach(function(b){b.onclick=function(){sweetDetail(+b.dataset.id)}});document.getElementById('sweetRefresh').onclick=function(){sweetLoading=true;sweetScreen();setTimeout(function(){sweetLoading=false;sweetScreen();sweetToast('Progress refreshed')},700)};sweetWireNav();
}
function sweetDetail(id){const h=habits.find(function(x){return x.id===id});const m=sweetModal(h.n,'<div class="note"><strong>'+h.s+' day gentle streak</strong><p>'+h.f+' · reminder '+h.r+'</p></div><div class="sweet-week">'+['M','T','W','Th','F','Sa','Su'].map(function(d,i){return '<div class="sweet-day '+(i<Math.min(h.s%7+1,7)?'on':'')+'">'+d+'</div>'}).join('')+'</div>','<button class="btn secondary" id="sweetEditDetail">Edit</button><button class="btn danger" id="sweetPauseDetail">'+(h.p?'Resume':'Pause')+'</button>');m.querySelector('#sweetEditDetail').onclick=function(){m.remove();sweetEdit(id)};m.querySelector('#sweetPauseDetail').onclick=function(){h.p=!h.p;m.remove();sweetScreen();sweetToast(h.p?'Habit paused':'Habit resumed')}}
function sweetSettings(){
 const s=document.querySelector('.screen'),paused=habits.filter(function(h){return h.p});
 s.innerHTML='<div class="greeting"><div><small>Preferences</small><h2>Settings</h2></div></div><div class="note"><div class="sweet-setting"><div><strong>Reduced motion</strong><small>Use simpler state feedback</small></div><input id="sweetReduce" type="checkbox" '+(sweetPrefs.reduced?'checked':'')+'></div><div class="sweet-setting"><div><strong>Celebrations</strong><small>Show completion feedback</small></div><input id="sweetCelebrate" type="checkbox" '+(sweetPrefs.celebrate?'checked':'')+'></div><div class="sweet-setting"><div><strong>Gentle language</strong><small>Avoid punitive streak language</small></div><input id="sweetGentle" type="checkbox" '+(sweetPrefs.gentle?'checked':'')+'></div></div><div class="note"><strong>Paused habits</strong><div class="habitlist">'+(paused.length?paused.map(function(h){return '<button class="habit sweetResume" data-id="'+h.id+'"><span class="hicon">'+h.i+'</span><span class="hname"><strong>'+h.n+'</strong><small>Paused · tap to resume</small></span><span>↻</span></button>'}).join(''):'<p>No paused habits.</p>')+'</div></div><button class="btn secondary" id="sweetReset">Reset onboarding</button>'+sweetNav('settings');
 document.getElementById('sweetReduce').onchange=function(e){sweetPrefs.reduced=e.target.checked;document.body.classList.toggle('manual-reduce',sweetPrefs.reduced);const r=document.getElementById('rm');if(r)r.checked=sweetPrefs.reduced};document.getElementById('sweetCelebrate').onchange=function(e){sweetPrefs.celebrate=e.target.checked};document.getElementById('sweetGentle').onchange=function(e){sweetPrefs.gentle=e.target.checked};document.querySelectorAll('.sweetResume').forEach(function(b){b.onclick=function(){habits.find(function(h){return h.id==b.dataset.id}).p=false;sweetToast('Habit resumed');sweetScreen()}});document.getElementById('sweetReset').onclick=function(){sweetFirst=true;sweetScreen()};sweetWireNav();

n><section class="panel"><div class="panelhead"><h2>System-state gallery</h2></div><div class="state-demo"><div><strong>No urgent work</strong><p>Positive empty state with a useful next action.</p></div><div><strong>Offline</strong><p>Changes would be queued locally in a real product.</p></div><div><strong>Permission denied</strong><p>Explains why an action is unavailable.</p></div><div><strong>Stale state</strong><p>Prompts refresh before overwriting newer data.</p></div></div></section>';
 document.getElementById('riskBtn').onclick=function(){hqProjectFilter='At Risk';hqView='projects';hRender()};document.getElementById('approvalBtn').onclick=function(){hqView='approvals';hRender()};document.getElementById('invoiceBtn').onclick=function(){hqInvoiceFilter='Overdue';hqView='billing';hRender()};document.querySelectorAll('[data-hview]').forEach(function(b){b.onclick=function(){hqView=b.dataset.hview;hRender()}});

function hProjects(c){
 c.innerHTML=hHeader('Projects','Portfolio health')+'<section class="panel"><div class="panelhead"><h2>Browse projects</h2><button class="btn secondary" id="hqReset">Reset filters</button></div><div class="filters"><input id="hqProjectSearch" aria-label="Search projects" placeholder="Search project, client or owner"><select id="hqHealth"><option>All</option><option>On Track</option><option>Needs Attention</option><option>At Risk</option></select><select id="hqSort"><option value="name">Sort: Name</option><option value="due">Sort: Due date</option><option value="health">Sort: Health</option></select></div><div id="hqProjectTable"></div></section>';document.getElementById('hqHealth').value=hqProjectFilter;document.getElementById('hqSort').value=hqProjectSort;hProjectTable();

function hProjectTable(){
 const holder=document.getElementById('hqProjectTable');if(!holder)return;const q=(document.getElementById('hqProjectSearch')?.value||'').toLowerCase();let rows=projects.filter(function(p){return (hqProjectFilter==='All'||p.health===hqProjectFilter)&&([p.name,p.client,p.owner].join(' ').toLowerCase().includes(q))});rows=rows.sort(function(a,b){if(hqProjectSort==='due')return a.due.localeCompare(b.due);if(hqProjectSort==='health')return a.health.localeCompare(b.health);return a.name.localeCompare(b.name)});

 holder.querySelectorAll('tr[data-project]').forEach(function(r){const open=function(e){if(e?.target.closest('.hqMenu'))return;hProjectDetail(+r.dataset.project)};r.onclick=open;r.onkeydown=function(e){if(e.key==='Enter'){open(e)}}});holder.querySelectorAll('.hqMenu').forEach(function(b){b.onclick=function(){hProjectMenu(+b.dataset.menu,b)}});

function hProjectMenu(id,anchor){const p=projects.find(function(x){return x.id===id});const m=modal('Project actions','<p><strong>'+p.name+'</strong></p><p>Choose a safe mock action.</p>','<button class="btn secondary" id="hqEditProject">Edit metadata</button><button class="btn danger" id="hqArchiveProject">Archive</button>');m.querySelector('#hqEditProject').onclick=function(){m.remove();hEditProject(id)};m.querySelector('#hqArchiveProject').onclick=function(){m.remove();hConfirmArchive(id)}}
function hConfirmArchive(id){const p=projects.find(function(x){return x.id===id});const m=modal('Archive “'+p.name+'”?','<p>This removes the project from active work in this local prototype. No real data is deleted.</p>','<button class="btn danger" id="hqConfirmArchive">Archive project</button>');m.querySelector('#hqConfirmArchive').onclick=function(){p.status='Archived';m.remove();hProjectTable()}}

function hProjectDetail(id){const p=projects.find(function(x){return x.id===id});modal(p.name,'<div class="hstack"><div class="hcard"><strong>Client</strong><p>'+p.client+'</p></div><div class="hcard"><strong>Health / Status</strong><p>'+p.health+' · '+p.status+'</p></div><div class="hcard"><strong>Next milestone</strong><p>'+p.due+' · '+p.approval+'</p></div><div class="hcard"><strong>Project context</strong><p>Tasks, deliverables and milestone details are represented as realistic mock state for this portfolio prototype.</p></div></div>','<button class="btn secondary" onclick="document.getElementById(\'modalBackdrop\').remove()">Close</button>')}
function hProjectWizard(){let step=0,data={};const renderStep=function(){const old=document.getElementById('modalBackdrop');if(old)old.remove();const labels=['Basics','Dates','Team','Review'];let body='<div class="wizardSteps">'+labels.map(function(x,i){return '<span class="'+(i<=step?'on':'')+'"></span>'}).join('')+'</div>';if(step===0)body+='<form id="hqWizard" class="hform"><label>Project name<input name="name" value="'+(data.name||'')+'" required></label><label>Client<select name="client">'+clients.map(function(c){return '<option>'+c.name+'</option>'}).join('')+'</select></label><label>Status<select name="status"><option>Planned</option><option>Active</option></select></label></form>';if(step===1)body+='<form id="hqWizard" class="hform"><label>Due date<input name="due" type="date" value="'+(data.due||'2026-10-20')+'"></label><label>Milestone<input name="milestone" value="'+(data.milestone||'First client review')+'"></label></form>';if(step===2)body+='<form id="hqWizard" class="hform"><label>Owner<select name="owner">'+team.filter(function(t){return !t.disabled}).map(function(t){return '<option>'+t.name+'</option>'}).join('')+'</select></label><label>Team note<textarea name="note">'+(data.note||'')+'</textarea></label></form>';if(step===3)body+='<div class="hstack"><div class="hcard"><strong>'+data.name+'</strong><p>'+data.client+' · '+data.status+'</p></div><div class="hcard"><strong>Due / milestone</strong><p>'+data.due+' · '+data.milestone+'</p></div><div class="hcard"><strong>Owner</strong><p>'+data.owner+'</p></div></div>';const m=modal('Create project · '+labels[step],body,(step>0?'<button class="btn secondary" id="hqBack">Back</button>':'')+'<button class="btn honey" id="hqNext">'+(step===3?'Create project':'Next')+'</button>');if(step>0)m.querySelector('#hqBack').onclick=function(){step--;renderStep()};m.querySelector('#hqNext').onclick=function(){const form=m.querySelector('#hqWizard');if(form){const d=new FormData(form);for(const [k,v] of d.entries())data[k]=v;if(step===0&&String(data.name).trim().length<3){alert('Enter at least 3 characters for the project name.');return}}if(step<3){step++;renderStep()}else{projects.push({id:Date.now(),name:data.name,client:data.client,health:'On Track',status:data.status,owner:data.owner,due:data.due,approval:'Not started',budget:'$8.0k'});hActivity.unshift({icon:'＋',text:data.name+' created',meta:'Just now · '+data.owner});m.remove();hqView='projects';hRender()}}};renderStep()}
function hClients(c){c.innerHTML=hHeader('Clients','Relationship context')+'<div class="hpagegrid">'+clients.map(function(x){return '<article class="hcard"><h3>'+x.name+'</h3><p>'+x.contact+'</p><p><strong>'+x.active+'</strong> active project'+(x.active===1?'':'s')+' · '+x.value+'</p><button class="btn secondary hClientOpen" data-client="'+x.name+'">Open client</button></article>'}).join('')+'</div>';document.querySelectorAll('.hClientOpen').forEach(function(b){b.onclick=function(){const x=clients.find(function(c){return c.name===b.dataset.client});const rel=projects.filter(function(p){return p.client===x.name});modal(x.name,'<p><strong>Primary contact:</strong> '+x.contact+'</p><p><strong>Active work:</strong> '+rel.map(function(p){return p.name}).join(', ')+'</p>','<button class="btn secondary" onclick="document.getElementById(\'modalBackdrop\').remove()">Close</button>')}})}

function hApprovalList(){const holder=document.getElementById('hqApprovalList');if(!holder)return;const f=document.getElementById('hqApprovalFilter').value,rows=approvals.filter(function(a){return f==='All'||a.state===f});holder.innerHTML=rows.length?rows.map(function(a){return '<div class="hlistrow"><div><strong>'+a.deliverable+'</strong><small>'+a.project+' · '+a.version+' · '+a.client+'</small></div><span>'+a.actor+'</span><span class="hstatus '+(a.state==='Approved'?'approved':'pending')+'">'+a.state+'</span><button class="btn secondary hApprovalOpen" data-id="'+a.id+'">Review</button></div>'}).join(''):'<div class="empty"><strong>No approvals in this state</strong><p>Nothing needs action here.</p></div>';holder.querySelectorAll('.hApprovalOpen').forEach(function(b){b.onclick=function(){hApprovalDetail(+b.dataset.id)}})}
function hApprovalDetail(id){const a=approvals.find(function(x){return x.id===id});const m=modal(a.deliverable,'<p><strong>Project:</strong> '+a.project+'</p><p><strong>Client:</strong> '+a.client+'</p><p><strong>Version:</strong> '+a.version+'</p><p><strong>Requested:</strong> '+a.requested+' · <strong>Due:</strong> '+a.due+'</p><p><strong>Decision state:</strong> '+a.state+'</p>','<button class="btn secondary" id="hqReminder">Record reminder</button><button class="btn danger" id="hqReject">Reject</button><button class="btn honey" id="hqApprove">Approve</button>');m.querySelector('#hqReminder').onclick=function(){hActivity.unshift({icon:'↗',text:'Reminder recorded for '+a.deliverable,meta:'Just now · Mock reminder'});m.remove();hRender()};m.querySelector('#hqReject').onclick=function(){a.state='Rejected';const p=projects.find(function(p){return p.name===a.project});if(p)p.health='Needs Attention';hActivity.unshift({icon:'×',text:a.deliverable+' rejected',meta:'Just now · Approval'});m.remove();hRender()};m.querySelector('#hqApprove').onclick=function(){a.state='Approved';const p=projects.find(function(p){return p.name===a.project});if(p){p.approval='Approved';if(p.health==='At Risk')p.health='Needs Attention'}hActivity.unshift({icon:'✓',text:a.deliverable+' approved',meta:'Just now · Approval'});m.remove();hRender()}}
function hTeam(c){c.innerHTML=hHeader('Team','Capacity and assignment')+'<div class="hpagegrid">'+team.map(function(t){return '<article class="hcard" style="'+(t.disabled?'opacity:.55':'')+'"><div class="row"><div><h3>'+t.name+'</h3><p>'+t.role+'</p></div><strong>'+t.capacity+'%</strong></div><div class="ctrack"><i style="width:'+t.capacity+'%"></i></div><p>'+(t.disabled?'Disabled user':t.capacity>=90?'Near capacity':'Healthy load')+'</p><button class="btn secondary hPerson" data-name="'+t.name+'" '+(t.disabled?'disabled':'')+'>Open person</button></article>'}).join('')+'</div>';document.querySelectorAll('.hPerson').forEach(function(b){b.onclick=function(){hPersonDetail(b.dataset.name)}})}
function hPersonDetail(name){const t=team.find(function(x){return x.name===name}),assigned=projects.filter(function(p){return p.owner===name});const m=modal(name,'<p><strong>'+t.role+'</strong> · '+t.capacity+'% capacity</p><div class="hstack">'+assigned.map(function(p){return '<div class="hcard"><strong>'+p.name+'</strong><p>'+p.due+' · '+p.health+'</p></div>'}).join('')+'</div>','<button class="btn honey" id="hqReassign">Reassign work</button>');m.querySelector('#hqReassign').onclick=function(){m.remove();hReassign(name)}}
function hReassign(from){const assigned=projects.filter(function(p){return p.owner===from});const m=modal('Reassign work','<form id="hqReassignForm" class="hform"><label>Project<select name="project">'+assigned.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>'}).join('')+'</select></label><label>New owner<select name="owner">'+team.filter(function(t){return !t.disabled&&t.name!==from}).map(function(t){return '<option>'+t.name+'</option>'}).join('')+'</select></label></form>','<button class="btn honey" form="hqReassignForm">Confirm reassignment</button>');m.querySelector('#hqReassignForm').onsubmit=function(e){e.preventDefault();const d=new FormData(e.target),p=projects.find(function(x){return x.id==d.get('project')}),newOwner=d.get('owner');p.owner=newOwner;team.find(function(x){return x.name===from}).capacity=Math.max(0,team.find(function(x){return x.name===from}).capacity-10);team.find(function(x){return x.name===newOwner}).capacity=Math.min(100,team.find(function(x){return x.name===newOwner}).capacity+10);hActivity.unshift({icon:'↔',text:p.name+' reassigned',meta:'Just now · '+from+' → '+newOwner});m.remove();hRender()}}

function hInvoiceList(){const holder=document.getElementById('hqInvoiceList');if(!holder)return;const rows=invoices.filter(function(i){return hqInvoiceFilter==='All'||i.state===hqInvoiceFilter});holder.innerHTML=rows.length?rows.map(function(i){return '<div class="hlistrow"><div><strong>'+i.id+' · '+i.client+'</strong><small>'+i.project+'</small></div><span>'+i.amount+'</span><span class="hstatus '+(i.state==='Overdue'?'overdue':'')+'">'+i.state+'</span><button class="btn secondary hInvoice" data-id="'+i.id+'">Open</button></div>'}).join(''):'<div class="empty"><strong>No invoices here</strong><p>There are no invoices matching this filter.</p></div>';holder.querySelectorAll('.hInvoice').forEach(function(b){b.onclick=function(){hInvoiceDetail(b.dataset.id)}})}

function hSettings(c){c.innerHTML=hHeader('Settings','Workspace preferences')+'<div class="hpagegrid"><article class="hcard"><h3>Workspace</h3><label class="field">Workspace name<input value="Honeycomb HQ Demo"></label><button class="btn honey" onclick="this.textContent=\'Saved ✓\'">Save</button></article><article class="hcard"><h3>Notifications</h3><label><input type="checkbox" checked> Approval decisions</label><br><label><input type="checkbox" checked> Deadline risks</label><br><label><input type="checkbox"> Invoice updates</label></article><article class="hcard"><h3>Prototype quality states</h3><p>Loading, empty, stale/conflict, permission and offline examples are represented throughout the demo.</p><button class="btn secondary" id="hqPermission">Show permission error</button></article></div>';document.getElementById('hqPermission').onclick=function(){modal('Permission denied','<p>You can view this workspace setting, but only an Owner can change it. No data was modified.</p>','<button class="btn secondary" onclick="document.getElementById(\'modalBackdrop\').remove()">Close</button>')}}
function hSearchModal(q){const term=q.toLowerCase();const groups=[['Projects',projects.filter(function(x){return x.name.toLowerCase().includes(term)||x.client.toLowerCase().includes(term)}).map(function(x){return x.name})],['Clients',clients.filter(function(x){return x.name.toLowerCase().includes(term)}).map(function(x){return x.name})],['People',team.filter(function(x){return x.name.toLowerCase().includes(term)}).map(function(x){return x.name})],['Invoices',invoices.filter(function(x){return x.id.toLowerCase().includes(term)||x.client.toLowerCase().includes(term)}).map(function(x){return x.id+' · '+x.client})]];const any=groups.some(function(g){return g[1].length});const m=modal('Global search','<div id="hqSearchLoading"><p>Searching…</p></div>','');setTimeout(function(){const box=m.querySelector('#hqSearchLoading');box.innerHTML=any?'<div class="searchResults">'+groups.filter(function(g){return g[1].length}).map(function(g){return '<div class="searchGroup"><strong>'+g[0]+'</strong>'+g[1].map(function(x){return '<div class="searchItem"><span>'+x+'</span><span>→</span></div>'}).join('')+'</div>'}).join('')+'</div>':'<div class="empty"><strong>No results</strong><p>Try a broader search. This is different from a data-load failure.</p></div>'},450)}
