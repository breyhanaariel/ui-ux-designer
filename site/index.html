<script>
const BASE='/ui-ux-designer/';
const route=location.pathname.replace(BASE,'').replace(/^\/|\/$/g,'');
const app=document.getElementById('app');
const nav=()=>`<nav class="topnav"><a class="brand" href="${BASE}">🎀 Brianna Dickenson</a><div class="navlinks"><a href="${BASE}sweet-habits/">🍓 Sweet Habits</a><a href="${BASE}blossom-ui/">🌸 Blossom UI</a><a href="${BASE}honeycomb-hq/">🍯 Honeycomb HQ</a></div></nav>`;
function modal(title,body,actions=''){document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mhead"><h2 id="mt">${title}</h2><button class="close" aria-label="Close dialog">×</button></div><div class="mbody">${body}</div><div class="mactions">${actions}</div></section></div>`);const b=document.getElementById('modalBackdrop');const close=()=>b.remove();b.querySelector('.close').focus();b.querySelector('.close').onclick=close;b.onclick=e=>{if(e.target===b)close()};document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc)}});return b}
function landing(){app.innerHTML=`<div class="landing">${nav()}<main id="main"><section class="hero"><div><p class="eyebrow">UI/UX Designer · Product Design · Design Systems</p><h1>Thoughtful experiences with a little softness built in.</h1><p class="lede">I design accessible web and mobile products from problem framing and information architecture through high-fidelity UI, prototyping, testing, and developer handoff.</p><div class="actions"><a class="btn primary" href="#work">View my work</a><a class="btn secondary" href="mailto:breyhanadickenson@gmail.com?subject=Interested%20in%20Working%20With%20You">Email me</a></div><div class="availability">🕓 Open to full-time remote roles · 💌 Available for short-term freelance projects</div></div><div class="heroart"><div class="float f1"><span>🍓</span><strong>Mobile UX</strong><small>Sweet Habits</small></div><div class="float f2"><span>🌸</span><strong>Design Systems</strong><small>Blossom UI</small></div><div class="float f3"><span>🍯</span><strong>B2B SaaS</strong><small>Honeycomb HQ</small></div></div></section><section class="section" id="work"><p class="eyebrow">Featured work</p><h2>Three projects, three different design muscles.</h2><div class="grid3">${[['🍓','Sweet Habits','Mobile Product Redesign','A gentle habit tracker that turns routine-building into a calm, encouraging experience.','sweetbg','sweet-habits/'],['🌸','Blossom UI','Modular Design System','A floral-inspired system proving expressive visual design can still be scalable and implementation-ready.','blossombg','blossom-ui/'],['🍯','Honeycomb HQ','Creative Agency Operations SaaS','A responsive B2B workspace for risks, approvals, deadlines, workload, and billing.','honeybg','honeycomb-hq/']].map(p=>`<article class="card"><div class="preview ${p[4]}">${p[0]}</div><p class="eyebrow" style="margin-top:17px">${p[2]}</p><h3>${p[1]}</h3><p>${p[3]}</p><div class="chips"><span class="pill">Responsive UI</span><span class="pill">Accessibility</span><span class="pill">Interaction</span></div><a class="btn secondary" href="${BASE+p[5]}">Open live project →</a></article>`).join('')}</div></section><section class="section about"><div><p class="eyebrow">How I work</p><h2>Structure first. Personality on purpose.</h2></div><div class="process">${[['01 Understand','Problem, audience, constraints, success.'],['02 Structure','Flows, hierarchy, IA, content.'],['03 Explore','Wireframes and competing directions.'],['04 Design','Accessible responsive high-fidelity UI.'],['05 Validate','Test assumptions and iterate.'],['06 Handoff','States, specs, components, implementation notes.']].map(x=>`<div><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div></section><section class="section contact"><p class="eyebrow">Work with me</p><h2>Have a product that needs clarity and character?</h2><p>I’m seeking full-time remote UI/UX or Product Design roles and short-term freelance projects.</p><div class="actions"><a class="btn primary" href="mailto:breyhanadickenson@gmail.com?subject=Interested%20in%20Working%20With%20You">Email me</a><a class="btn secondary" href="https://www.linkedin.com/in/brianna-dickenson-9555515b">LinkedIn</a></div></section></main><footer class="footer">Designed & built as a living UI/UX portfolio · 2026</footer></div>`}
let habits=[{n:'Morning water',i:'💧',d:true,s:8},{n:'10 minute stretch',i:'🌷',d:false,s:4},{n:'Read a little',i:'📚',d:false,s:12}];
function sweetRender(){const done=habits.filter(h=>h.d).length,pct=Math.round(done/habits.length*100);document.getElementById('habitList').innerHTML=habits.map((h,i)=>`<button class="habit ${h.d?'done':''}" data-i="${i}" aria-pressed="${h.d}"><span class="hicon">${h.i}</span><span class="hname"><strong>${h.n}</strong><small>${h.s} day gentle streak</small></span><span class="check">${h.d?'✓':''}</span></button>`).join('');document.getElementById('pct').textContent=pct+'%';document.getElementById('count').textContent=done+' of '+habits.length+' habits complete';document.getElementById('bar').style.width=pct+'%';document.getElementById('enc').textContent=pct===100?'Everything is done. Tiny victory dance optional.':pct>=50?'You’re already halfway there.':'A gentle start still counts.';document.querySelectorAll('.habit').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;habits[i].d=!habits[i].d;habits[i].s=Math.max(0,habits[i].s+(habits[i].d?1:-1));sweetRender()})}
function sweet(){app.innerHTML=`<div class="sweet">${nav()}<main id="main"><section class="intro"><div><p class="eyebrow">🍓 Interactive mobile product concept</p><h1>Sweet Habits</h1><p>A habit tracker designed to feel supportive instead of strict. Complete habits, add one, and watch progress update live.</p></div><label class="toggle"><input id="rm" type="checkbox"> Reduced motion</label></section><section class="phonewrap"><div class="phone"><div class="phonebar"><span>9:41</span><span>● ● ●</span></div><div class="screen"><div class="greeting"><div><small>Good morning</small><h2>One sweet step at a time 🍓</h2></div><button class="avatar">BD</button></div><div class="progress"><div class="progresshead"><strong id="pct"></strong><span id="count"></span></div><div class="track"><i id="bar"></i></div><p id="enc"></p></div><div class="today"><div><small>Today</small><h3>Your little list</h3></div><button class="add" id="addHabit" aria-label="Add habit">+</button></div><div class="habitlist" id="habitList"></div><div class="week"><div class="weektop"><span>Weekly glow</span><strong>4 days active</strong></div><div class="weekdays"><i class="on">M</i><i class="on">T</i><i class="on">W</i><i>Th</i><i class="on">F</i><i>Sa</i><i>Su</i></div></div><nav class="phonenav"><button class="active">⌂<span>Today</span></button><button>♡<span>Progress</span></button><button>⚙<span>Settings</span></button></nav></div></div><aside class="notes"><p class="eyebrow">Try it</p><h2>Functional prototype</h2><ul><li>Complete and un-complete habits.</li><li>Add a custom habit.</li><li>Watch progress update instantly.</li><li>Toggle reduced motion.</li></ul><div class="note"><strong>Design intent</strong><p>Core actions stay obvious, progress is visible without shame language, and celebratory styling never hides system status.</p></div></aside></section></main></div>`;sweetRender();document.getElementById('rm').onchange=e=>document.body.style.setProperty('scroll-behavior',e.target.checked?'auto':'smooth');document.getElementById('addHabit').onclick=()=>{const m=modal('Add a tiny habit ✨',`<form class="form" id="hf"><label>Habit name<input name="name" required placeholder="e.g. Evening tea"></label><label>Frequency<select><option>Every day</option><option>Weekdays</option><option>Custom</option></select></label></form>`,`<button class="btn pink" form="hf">Add habit</button>`);m.querySelector('#hf').onsubmit=e=>{e.preventDefault();const n=new FormData(e.target).get('name').trim();if(n){habits.push({n,i:'✨',d:false,s:0});m.remove();sweetRender()}}}}
let bSection='foundations';
function blossomRender(){const c=document.getElementById('bcontent');document.querySelectorAll('.bside button[data-sec]').forEach(x=>x.classList.toggle('active',x.dataset.sec===bSection));if(bSection==='foundations')c.innerHTML=`<p class="eyebrow">🌸 Interactive design system</p><h1>Foundations</h1><p class="systemlede">Soft visual language, explicit behavior, and implementation-minded documentation.</p><article class="doc"><div class="dochead"><div><small>01</small><h2>Color tokens</h2></div><p>Semantic roles sit above expressive primitives so component meaning survives brand evolution.</p></div><div class="swatches">${[['Blush','#E88BAA'],['Rose','#C85B80'],['Lavender','#A99BE8'],['Sage','#83A98A'],['Cream','#FFF8F2'],['Ink','#3F3540']].map(x=>`<div class="swatch"><span style="background:${x[1]}"></span><strong>${x[0]}</strong><code>${x[1]}</code></div>`).join('')}</div></article><article class="doc"><div class="dochead"><div><small>02</small><h2>Typography</h2></div><p>Expressive headings pair with highly readable interface text.</p></div><div class="typespec"><small>Display / 52</small><strong class="display">Grow gently.</strong><small>Body / 16</small><p>Clear language and comfortable line height keep expressive design usable.</p></div></article>`;else if(bSection==='components')c.innerHTML=`<p class="eyebrow">🌸 Interactive design system</p><h1>Components</h1><p class="systemlede">Try the component states rather than viewing static specimens.</p><article class="doc"><div class="dochead"><div><small>Button</small><h2>Action family</h2></div><p>Primary, secondary, destructive and disabled states use explicit focus and status.</p></div><div class="stage"><button class="bb primary" id="saveToast">Primary action</button><button class="bb secondary" id="dialogBtn">Open dialog</button><button class="bb danger">Delete draft</button><button class="bb primary" id="disabledBtn">Ready</button><label><input type="checkbox" id="disableToggle"> Disable last button</label></div></article><article class="doc"><div class="dochead"><div><small>Status</small><h2>Feedback</h2></div><p>Color always ships with text or icon meaning.</p></div><div class="stage"><span class="status success">✓ Approved</span><span class="status warning">! Needs review</span><span class="status error">× Error</span><span class="status neutral">• Draft</span></div></article>`;else c.innerHTML=`<p class="eyebrow">🌸 Interactive design system</p><h1>Patterns</h1><p class="systemlede">A realistic settings surface proves the system works beyond isolated components.</p><article class="doc"><div class="settings"><div class="setnav"><strong>Workspace</strong><button class="active">Profile</button><button>Notifications</button><button>Appearance</button><button>Accessibility</button></div><div class="setpanel"><h3>Profile settings</h3><p>Keep your workspace identity current.</p><label class="field">Display name<input value="Brianna D."></label><label class="field">Role<input value="Product Designer"></label><button class="bb primary">Save changes</button></div></div></article>`;const st=document.getElementById('saveToast');if(st)st.onclick=()=>{document.body.insertAdjacentHTML('beforeend','<div class="toast" id="toast" role="status">🌷 Changes saved</div>');setTimeout(()=>document.getElementById('toast')?.remove(),2200)};const db=document.getElementById('dialogBtn');if(db)db.onclick=()=>modal('A documented dialog','<p>This modal demonstrates a named dialog, visible close control, Escape-to-close, and focus movement.</p>','<button class="btn primary" onclick="document.getElementById(\'modalBackdrop\').remove()">Got it</button>');const dt=document.getElementById('disableToggle');if(dt)dt.onchange=e=>{const b=document.getElementById('disabledBtn');b.disabled=e.target.checked;b.textContent=e.target.checked?'Disabled':'Ready'}}
function blossom(){app.innerHTML=`<div class="blossom">${nav()}<main id="main" class="bwrap"><aside class="bside"><div class="blogo"><span>🌸</span><div><strong>Blossom UI</strong><small>v1 portfolio library</small></div></div><button data-sec="foundations">Foundations</button><button data-sec="components">Components</button><button data-sec="patterns">Patterns</button></aside><section class="bcontent" id="bcontent"></section></main></div>`;document.querySelectorAll('.bside button[data-sec]').forEach(b=>b.onclick=()=>{bSection=b.dataset.sec;blossomRender()});blossomRender()}
let projects=[['Moonpetal Brand Refresh','Moonpetal House','At Risk','Maya Chen','Sep 13','2 waiting','$18.4k'],['Fawn & Finch Fall Launch','Fawn & Finch','Needs Attention','Rory Bell','Sep 18','1 waiting','$12.8k'],['DaisyDesk Website','DaisyDesk','On Track','Maya Chen','Sep 25','Clear','$9.6k'],['Lemon Drop Social Kit','Lemon Drop Co.','On Track','Ivy Brooks','Oct 04','Not started','$6.2k'],['Velvet Moss Packaging','Velvet Moss','Needs Attention','Rory Bell','Sep 30','Client delayed','$14.1k']];let q='',hf='All',approvals=3,followed=false;
function hTable(){const rows=projects.filter(p=>(hf==='All'||p[2]===hf)&&(p.join(' ').toLowerCase().includes(q.toLowerCase())));document.getElementById('rows').innerHTML=rows.map((p,i)=>`<tr tabindex="0" data-name="${p[0]}"><td data-label="Project"><strong>${p[0]}</strong><small>${p[1]}</small></td><td data-label="Health"><span class="health ${p[2].toLowerCase().replaceAll(' ','-')}">${p[2]==='On Track'?'●':p[2]==='At Risk'?'▲':'◆'} ${p[2]}</span></td><td data-label="Owner">${p[3]}</td><td data-label="Next due">${p[4]}</td><td data-label="Approval">${p[5]}</td><td data-label="Budget">${p[6]}</td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><strong>No matching projects</strong><p>Try a broader search or clear your filters.</p></div></td></tr>`;document.querySelectorAll('#rows tr[data-name]').forEach(r=>{const open=()=>{const p=projects.find(x=>x[0]===r.dataset.name);modal(p[0],`<p><strong>Client:</strong> ${p[1]}</p><p><strong>Owner:</strong> ${p[3]}</p><p><strong>Health:</strong> ${p[2]}</p><div class="note"><strong>Next action</strong><p>${p[2]==='At Risk'?'Client approval is blocking the next milestone. Follow up before 4 PM.':'No urgent blocker. Continue planned work.'}</p></div>`,`<button class="btn honey" id="resolve">Mark risk resolved</button>`);document.getElementById('resolve').onclick=()=>{p[2]='On Track';document.getElementById('modalBackdrop').remove();hTable()}};r.onclick=open;r.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')open()}})}

ch projects, clients, owners…"><select id="health" aria-label="Health filter"><option>All</option><option>On Track</option><option>Needs Attention</option><option>At Risk</option></select></div><div class="tablewrap"><table><thead><tr><th>Project</th><th>Health</th><th>Owner</th><th>Next due</th><th>Approval</th><th>Budget</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="bottom"><article class="panel"><div class="panelhead"><h2>Capacity watch</h2></div><div class="capacity">${[['Maya Chen',92],['Rory Bell',81],['Ivy Brooks',64],['Noah Lane',58]].map(x=>`<div class="crow"><div><strong>${x[0]}</strong><small>${x[1]>=90?'Near capacity':'Healthy load'}</small></div><div class="ctrack"><i style="width:${x[1]}%"></i></div><b>${x[1]}%</b></div>`).join('')}</div></article><article class="panel"><div class="panelhead"><h2>Meaningful changes</h2></div><ul class="activity"><li><span>✓</span><div><strong>DaisyDesk homepage approved</strong><small>12 minutes ago · Client approval</small></div></li><li><span>↗</span><div><strong>Fawn & Finch milestone moved</strong><small>42 minutes ago · Sep 16 → Sep 18</small></div></li><li><span>$</span><div><strong>Moonpetal invoice overdue</strong><small>Yesterday · $4,800 outstanding</small></div></li></ul></article></section></section></main></div>`;hTable();document.getElementById('search').oninput=e=>{q=e.target.value;hTable()};document.getElementById('health').onchange=e=>{hf=e.target.value;hTable()};document.getElementById('reset').onclick=()=>{q='';hf='All';document.getElementById('search').value='';document.getElementById('health').value='All';hTable()};document.getElementById('riskBtn').onclick=()=>{hf='At Risk';document.getElementById('health').value='At Risk';hTable();document.getElementById('projectPanel').scrollIntoView({behavior:'smooth'})};document.getElementById('approvalBtn').onclick=()=>{approvals=Math.max(0,approvals-1);document.getElementById('acount').textContent=approvals;document.getElementById('approvalText').textContent=approvals+' approvals waiting'};document.getElementById('invoiceBtn').onclick=()=>{followed=true;document.getElementById('invoiceText').textContent='Follow-up recorded'};document.getElementById('newProject').onclick=()=>{const m=modal('Create a new project',`<form class="form" id="pf"><label>Project name<input name="name" required></label><label>Client<input name="client" required></label><label>Owner<select name="owner"><option>Brianna Dickenson</option><option>Maya Chen</option><option>Rory Bell</option></select></label></form>`,`<button class="btn honey" form="pf">Create project</button>`);m.querySelector('#pf').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);projects.push([d.get('name'),d.get('client'),'On Track',d.get('owner'),'Oct 20','Not started','$8.0k']);m.remove();hTable()}}}
