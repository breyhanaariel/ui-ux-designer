name: Validate UI UX Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required portfolio files
        run: |
          test -f site/index.html
          test -f README.md
          test -f sweet-habits/README.md
          test -f blossom-ui/README.md
          test -f honeycomb-hq/README.md
          test -f sweet-habits/assets/hero.png
          test -f blossom-ui/assets/hero.png
          test -f honeycomb-hq/assets/hero.png
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/script.js
          test -f docs/.nojekyll
          test -f docs/sweet-habits/index.html
          test -f docs/blossom-ui/index.html
          test -f docs/honeycomb-hq/index.html
          test -f docs/404.html
          grep -q "Research" docs/index.html
          grep -q "Sweet Habits" docs/sweet-habits/index.html
          grep -q "Blossom UI" docs/blossom-ui/index.html
          grep -q "Honeycomb HQ" docs/honeycomb-hq/index.html
          grep -q "Sweet Habits" site/index.html
          grep -q "Blossom UI" site/index.html
          grep -q "Honeycomb HQ" site/index.html
      - name: Package static portfolio
        run: |
          mkdir -p public/sweet-habits public/blossom-ui public/honeycomb-hq
          cp site/index.html public/index.html
          cp site/index.html public/sweet-habits/index.html
          cp site/index.html public/blossom-ui/index.html
          cp site/index.html public/honeycomb-hq/index.html
          cp site/index.html public/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: ui-ux-portfolio-static
          path: public
